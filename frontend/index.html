<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İTÜ Personel Özlük Sistemi</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>İTÜ Personel Özlük Sistemi</h1>
                <p>Bilgisayar ve Bilişim Fakültesi</p>
            </div>
            <div class="header-actions">
                <button id="uploadDataBtn" class="btn btn-primary">
                    📤 Veri Yükle
                </button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-button active" data-view="all">
                👥 Tüm Personel
            </button>
            <button class="tab-button" data-view="arastirma-gorevlisi">
                🎓 Araştırma Görevlisi
            </button>
            <button class="tab-button" data-view="ogretim-gorevlisi">
                📚 Öğretim Görevlisi
            </button>
            <button class="tab-button" data-view="dr-ogretim-uyesi">
                🎖️ Dr. Öğretim Üyesi
            </button>
            <button class="tab-button" data-view="docent">
                🏅 Doçent
            </button>
            <button class="tab-button" data-view="profesor">
                👨‍🏫 Profesör
            </button>
            <button class="tab-button" data-view="idari">
                💼 İdari Personel
            </button>
        </nav>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 İsim, TC No veya Sicil No ile ara...">
            <select id="departmentFilter">
                <option value="">Tüm Bölümler</option>
            </select>
            <select id="statusFilter">
                <option value="">Tüm Durumlar</option>
                <option value="Aktif">Aktif</option>
                <option value="Pasif">Pasif</option>
            </select>
        </div>

        <main>
            <div class="stats-container" id="statsContainer">
                <!-- Statistics will be displayed here -->
            </div>
            
            <div class="cards-container" id="cardsContainer">
                <!-- Personnel cards will be displayed here -->
            </div>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <h2>📋 Veri Bulunamadı</h2>
                <p>Lütfen "Veri Yükle" butonunu kullanarak JSON dosyası yükleyin.</p>
                <button id="loadSampleBtn" class="btn btn-primary">
                    📥 Örnek Veri Yükle
                </button>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/business_logic.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
